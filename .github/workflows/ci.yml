name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: T-02 / build-and-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify toolchain
        run: |
          test "$(node --version)" = 'v24.21.0'
          test "$(pnpm --version)" = '10.15.1'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci_placeholder:ci_placeholder@localhost:5432/unused
        run: pnpm --filter api exec prisma generate
      - name: Generate Next.js route types
        run: pnpm --filter web exec next typegen
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  lint:
    name: T-02 / lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify toolchain
        run: |
          test "$(node --version)" = 'v24.21.0'
          test "$(pnpm --version)" = '10.15.1'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  test:
    name: T-02 / test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: postgresql://ci_test_user:ci_test_password@localhost:5432/sprint2_integration?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: sprint2_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test_user -d sprint2_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify toolchain
        run: |
          test "$(node --version)" = 'v24.21.0'
          test "$(pnpm --version)" = '10.15.1'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply test migrations
        run: pnpm --filter api exec prisma migrate deploy
      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate
      - name: Unit tests
        run: pnpm test
      - name: API integration test
        env:
          DATABASE_URL: postgresql://ci_test_user:ci_test_password@localhost:5432/sprint2_integration?schema=public
        run: pnpm --filter api run test:e2e