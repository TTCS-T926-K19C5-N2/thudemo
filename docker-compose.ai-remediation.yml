services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: remediation
      POSTGRES_PASSWORD: ${AI_REMEDIATION_DB_PASSWORD:?Generated by isolated profile manager}
      POSTGRES_DB: codegym_remediation
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remediation -d codegym_remediation"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  smtp:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1::1025"
      - "127.0.0.1::8025"
volumes:
  postgres_data:
