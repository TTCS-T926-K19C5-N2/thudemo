# Explicit isolated demo profile; never production. No database/cache host ports.
name: ${COMPOSE_PROJECT_NAME:-thudemo-demo}
x-demo: &demo
  CONFIG_IGNORE_ENV_FILE: "true"
  APP_ENV: demo
  DEMO_MODE: "true"
  DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD (12+ characters) in .env}
  DEMO_DATE: ${DEMO_DATE:-}
  DEMO_BATCH: ${DEMO_BATCH:-1}
  DEMO_SEED: ${DEMO_SEED:-true}
  WEB_ORIGIN: ${PUBLIC_URL:-http://localhost:3488}
  DATABASE_URL: postgresql://${POSTGRES_USER:-demo}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-thudemo_demo}?schema=public
  REDIS_HOST: redis
  REDIS_PORT: "6379"
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-thudemo_demo}
    volumes: [demo_pg:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [demo_redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports: ["127.0.0.1:${MAIL_UI_PORT:-8138}:8025"]
    environment: {MP_DATABASE: /data/mailpit.db}
    volumes: [demo_mail:/data]
  init:
    image: ${COMPOSE_PROJECT_NAME:-thudemo-demo}-api
    pull_policy: never
    user: "0:0"
    environment: *demo
    volumes: [demo_keys:/demo-state]
    command: [node, demo.mjs, init]
    restart: "no"
  prepare:
    build: {context: ., target: migration}
    environment: *demo
    volumes: [demo_keys:/demo-state]
    command: [node, demo.mjs, prepare]
    depends_on:
      init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: "no"
  api:
    image: ${COMPOSE_PROJECT_NAME:-thudemo-demo}-api
    build: {context: ., target: api}
    environment:
      <<: *demo
      NODE_ENV: development # existing mock gate allows only dev/test; compiled API, no watcher
      PORT: "3001"
      CONFIG_IGNORE_ENV_FILE: "true"
      PAYMENT_GATEWAY: mock
      MOCK_WEBHOOK_DELAY_MS: "0"
      API_INTERNAL_URL: http://api:3001
      TICKET_MAIL_WORKER: "true"
      ACCOUNTANT_EMAIL: ${ACCOUNTANT_EMAIL:-}
      TICKET_MAIL_MODE: catcher
      TICKET_SMTP_HOST: mailpit
      TICKET_SMTP_PORT: "1025"
      TICKET_SMTP_FROM: tickets@demo.invalid
      REGISTRATION_MAIL_MODE: catcher
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: accounts@demo.invalid
      HOLD_EXPIRY_MODE: off
      ORDER_EXPIRY_MODE: off
    volumes: [demo_keys:/demo-state:ro]
    command: [node, demo.mjs, api]
    depends_on:
      prepare: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      mailpit: {condition: service_started}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped
  web:
    build: {context: ., target: web}
    environment:
      NODE_ENV: production
      DEMO_MODE: "true"
      API_INTERNAL_URL: http://api:3001
      WEB_HOST: 0.0.0.0
      WEB_PORT: "3000"
      WEB_ORIGIN: ${PUBLIC_URL:-http://localhost:3488}
    volumes: [demo_keys:/demo-state:ro]
    command: [node, demo.mjs, web]
    ports: ["${DEMO_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3488}:3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped
volumes:
  demo_pg:
  demo_redis:
  demo_keys:
  demo_mail:
